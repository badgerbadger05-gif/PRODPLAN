name: prodplan

services:
  db:
    image: postgres:15
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Europe/Moscow"]
    environment:
      POSTGRES_DB: ${PRODPLAN_POSTGRES_DB:-prodplan}
      POSTGRES_USER: ${PRODPLAN_POSTGRES_USER:-prodplan}
      POSTGRES_PASSWORD: ${PRODPLAN_POSTGRES_PASSWORD:-prodplan_password_change_me}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - prodplan_postgres_data:/var/lib/postgresql/data
    ports:
      - "${PRODPLAN_POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODPLAN_POSTGRES_USER:-prodplan} -d ${PRODPLAN_POSTGRES_DB:-prodplan}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PRODPLAN_POSTGRES_USER:-prodplan}:${PRODPLAN_POSTGRES_PASSWORD:-prodplan_password_change_me}@db:5432/${PRODPLAN_POSTGRES_DB:-prodplan}
      PLANNING_TRUTH_MAX_AGE_SECONDS: "${PRODPLAN_TRUTH_MAX_AGE_SECONDS:-86400}"
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PRODPLAN_BACKEND_PORT:-8010}:8000"
    volumes:
      - ./config-test:/app/config
      - ./output-test:/app/output
    extra_hosts:
      - "mtzw7:10.36.0.6"
      - "mtzw7.lan:10.36.0.6"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend-erp-shell
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PRODPLAN_FRONTEND_PORT:-9010}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sync-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    command: ["python", "sync_worker.py"]
    environment:
      TZ: Europe/Moscow
      SYNC_BASE_URL: "http://backend:8000"
      SYNC_TICK_INTERVAL_SECONDS: "${PRODPLAN_SYNC_TICK_INTERVAL_SECONDS:-120}"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prodplan_postgres_data:
