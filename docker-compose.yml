services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: prodplan
      POSTGRES_USER: prodplan
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodplan -d prodplan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://prodplan:password@db:5432/prodplan
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/app/config
      - ./output:/app/output
    extra_hosts:
      - "mtzw7:10.36.0.6"
      - "mtzw7.lan:10.36.0.6"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9000:80"
    volumes:
      - ./frontend/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  
volumes:
  postgres_data:
