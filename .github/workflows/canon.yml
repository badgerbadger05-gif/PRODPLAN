name: Canon gates

on:
  pull_request:
  push:

jobs:
  canon-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      # Structural ownership plus executable data/conservation gates.  These
      # suites build real generation rows in a temporary DB and exercise the
      # same validators that run before publication.
      - run: >-
          pytest -q tests/test_canon_invariants.py
          tests/services/test_generation_lifecycle.py
          tests/services/test_obligation_refresh_validation.py
          tests/services/test_assembly_output_persistence.py
          tests/services/test_mrp_freeze.py
          tests/services/test_purchase_control_snapshot.py

  backend:
    needs: canon-invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prodplan
          POSTGRES_PASSWORD: prodplan
          POSTGRES_DB: prodplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodplan -d prodplan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRODPLAN_TEST_PG_URL: postgresql://prodplan:prodplan@localhost:5432/prodplan_test
      PRODPLAN_PG_CHECK_DSN: postgresql://prodplan:prodplan@localhost:5432/prodplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: pytest -q
      - run: cd backend && alembic heads

  frontend:
    needs: canon-invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-erp-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-erp-shell/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: frontend-erp-shell/test-results
          if-no-files-found: ignore
          retention-days: 7
