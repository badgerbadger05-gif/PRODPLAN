services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: prodplan
      POSTGRES_USER: prodplan
      POSTGRES_PASSWORD: password
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodplan -d prodplan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://prodplan:password@db:5432/prodplan
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend:/app/backend:ro
      - ./tests:/app/tests:ro
      - ./config:/app/config
      - ./output:/app/output
    extra_hosts:
      - "mtzw7:10.36.0.6"
      - "mtzw7.lan:10.36.0.6"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend-erp-shell
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Авто-синхронизация с 1С, растянутая по времени. Каждые ~2 минуты дёргает
  # /api/v1/sync/auto/tick — оркестратор выполняет не более одного просроченного
  # job за тик (один OData-pull за раз, без пиков). Read-only к 1С.
  sync-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: ["python", "sync_worker.py"]
    environment:
      TZ: Europe/Moscow
      SYNC_BASE_URL: "http://backend:8000"
      SYNC_TICK_INTERVAL_SECONDS: "120"
    depends_on:
      backend:
        condition: service_healthy

  # Регламент сверки остаточной потребности MRP. Каждые 3 часа POST-ит на
  # /api/v1/plan/reconcile: пересчитывает активные снимки и добирает
  # недопокрытие (заказы в журнал, строки закупок). В 1С ничего не пишет.
  reconcile-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: ["python", "reconcile_worker.py"]
    environment:
      TZ: Europe/Moscow
      RECONCILE_BASE_URL: "http://backend:8000"
      RECONCILE_INTERVAL_SECONDS: "10800"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

# ───────────────────────────────────────────────────────────────────────────────
# Note about the legacy `prodplan_default` Docker network
# ───────────────────────────────────────────────────────────────────────────────
# The project was previously rooted at C:\prodplan and produced a docker-compose
# stack named `prodplan_*` (network `prodplan_default`, db container `prodplan-db-1`).
#
# After moving the repo to C:\prodplan-erp this stack creates new containers
# (`prodplan-erp-*`) on a new isolated network `prodplan-erp_default`. The legacy
# DB still holds production-like data (~11k items, real specs, planning history),
# while the local `db` service here starts empty.
#
# Until the data is migrated, the backend container is manually attached to BOTH
# networks so that its `db` hostname resolves to the legacy populated database:
#
#   docker network connect --alias backend prodplan-erp_default prodplan-erp-backend-1
#   docker network connect prodplan_default prodplan-erp-backend-1
#
# When you're ready to retire the legacy stack run scripts/migrate_legacy_db.sh
# (it dumps prodplan-db-1, wipes prodplan-erp-db-1, and restores). After that
# the backend can stay on `prodplan-erp_default` only and the legacy containers
# can be stopped and removed.
